name: ci

on:
  push:
  pull_request:
  workflow_dispatch:
  schedule:
    # Weekly, to catch flakiness that a single run would not.
    - cron: "0 6 * * 1"

env:
  PYTHONPATH: compiler:tests:examples

jobs:
  rtl:
    name: rtl lint
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: install verilator
        run: |
          sudo apt-get update
          sudo apt-get install -y verilator
      - name: verilator must be 5 or newer
        run: |
          version=$(verilator --version | awk '{print $2}')
          echo "verilator $version"
          case "$version" in 5.*) ;; *) echo "need Verilator 5"; exit 1;; esac
      - run: make lint

  unit:
    name: unit tests, python ${{ matrix.python }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        python: ["3.10", "3.11", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      # setuptools builds the wheel and is no longer bundled from 3.12 on.
      - run: pip install "numpy>=1.20" setuptools
      - name: install tcl
        # Without tclsh the stubbed Vivado script tests skip silently.
        run: |
          sudo apt-get update
          sudo apt-get install -y tcl
      - run: make models
      - name: unit, determinism and vivado script tests
        run: make test-unit
      - name: C++ kernels against the python model
        run: make test-cpp

  simulation:
    name: verilator end to end
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install "numpy>=1.20"
      - name: install verilator
        run: |
          sudo apt-get update
          sudo apt-get install -y verilator
      - run: make models
      - name: quantized import, in simulation
        # Also runs in the unit job, but its simulation half skips there without verilator.
        run: python -m unittest discover -s tests -p "test_quantized_import.py" -v
      - name: residual, forks and joins
        run: python -m unittest discover -s tests -p "test_residual.py" -v
      - name: sliding window geometry sweep
        run: python -m unittest discover -s tests -p "test_sliding_window.py" -v
      - name: full models against the golden model
        run: python -m unittest discover -s tests -p "test_simulation.py" -v
      - name: the Python API, end to end
        run: python -m unittest discover -s tests -p "test_api.py" -v

  package:
    name: wheel and installed layout
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install "numpy>=1.20" setuptools wheel
      - name: install verilator
        run: |
          sudo apt-get update
          sudo apt-get install -y verilator
      - run: make models
      - name: build the wheel and run it from outside the checkout
        run: python -m unittest discover -s tests -p "test_packaging.py" -v
      - name: the console command works once installed
        env:
          PYTHONPATH: ""
        run: |
          pip install --force-reinstall --no-deps dist/onnx2fpga-*.whl
          cd "$(mktemp -d)"
          onnx2fpga doctor
          onnx2fpga devices

  flake:
    name: shuffled reruns
    # On demand and weekly only: it reruns everything several times, too slow to gate a push.
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install "numpy>=1.20"
      - name: install verilator
        run: |
          sudo apt-get update
          sudo apt-get install -y verilator
      - run: make models
      - run: make test-flaky-all
